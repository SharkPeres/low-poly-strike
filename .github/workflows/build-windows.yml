
name: Build Windows portable

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip

      - name: Baixar Godot 4.3
        run: |
          mkdir -p ~/godot
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot
          chmod +x ~/godot/Godot_v4.3-stable_linux.x86_64

      - name: Baixar templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. ~/.local/share/godot/export_templates/4.3.stable/

      - name: Importar projeto
        run: |
          ~/godot/Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit

      - name: Compilar jogo Windows
        run: |
          mkdir -p build
          ~/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" build/LowPolyStrike.exe

      - name: Criar pacote
        run: |
          mkdir -p package
          cp build/LowPolyStrike.exe package/
          cp README.md package/LEIA-ME.txt
          cd package
          zip -r ../LowPolyStrike-Windows-x64.zip .

      - name: Disponibilizar download
        uses: actions/upload-artifact@v4
        with:
          name: LowPolyStrike-Windows-x64
          path: LowPolyStrike-Windows-x64.zip
          retention-days: 30
